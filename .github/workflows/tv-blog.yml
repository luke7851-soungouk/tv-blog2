name: 오늘의 TV 네이버 블로그 글 만들기

on:
  workflow_dispatch:
  schedule:
    # 매일 한국시간 오전 8시 (UTC 전날 23시)
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 필요한 프로그램 설치
        run: pip install -r requirements.txt

      - name: 오늘의 블로그 글 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
        run: python main.py

      - name: 생성된 글 저장소에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "새로 저장할 변경 사항이 없습니다."
          else
            git commit -m "오늘의 TV 블로그 글 자동 생성"
            git push
          fi
